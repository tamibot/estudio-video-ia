<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #08080A; }
    .imagen {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 46% 30% at 50% 38%, #4a423d 0%, rgba(74, 66, 61, 0) 100%),
        radial-gradient(ellipse 80% 60% at 50% 70%, #2b2826 0%, #121212 70%, #08080A 100%);
    }
  </style>
  <div id="root" data-composition-id="aroll-demo" data-width="1080" data-height="1920">
    <div class="imagen"></div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('[data-composition-id="aroll-demo"] .imagen', { scale: 1.08 }, { scale: 1, duration: 3, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["aroll-demo"] = tl;
    })();
  </script>
</template>
