<!--
  Escena 6 · Texto con comillas (minimal premium)
  Fondo azul rugoso (o papel), dos comillas grandes y la frase escrita palabra por palabra.
  Editar: fondo = clase de .escena: "azul" (por defecto) o "papel".
          Cada línea lleva data-t = segundo de cada palabra, en orden.
          .chica = línea de arriba (Inter 500); .clave = palabra grande (agrega "serif" para Playfair Bold Italic).
  Tiempos en segundos desde el inicio de la escena.
-->
<template>
  <style>
    @font-face { font-family: "Inter"; src: url("assets/fuentes/inter-latin.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
    @font-face { font-family: "Playfair Display"; src: url("assets/fuentes/playfair-italic-latin.woff2") format("woff2"); font-weight: 400 900; font-style: italic; }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #0E1A4C;
      --papel: #EEEBEF; --tinta: #08080A; --azul: #1B42D3; --azul-noche: #0E1A4C; --blanco: #F5F4F2;
    }
    /* La cámara lleva fondo, textura y texto juntos: la textura se mueve con lo que cubre. */
    .camara { position: absolute; inset: -90px; }
    .capa { position: absolute; inset: 0; }
    /* Azul casi plano con viñeta leve; papel rugoso fino encima (variación de luz ≈ ±5 %). */
    .fondo { background: radial-gradient(ellipse 85% 70% at 50% 46%, #1E48DE 0%, var(--azul) 60%, #1A3ECB 100%); }
    .rugoso { background: url("assets/texturas/rugoso.svg") center / cover; mix-blend-mode: soft-light; opacity: 0.14; }
    .grano { background: url("assets/texturas/grano.svg") 0 0 / 512px 512px repeat; mix-blend-mode: soft-light; opacity: 0.05; }
    .papel .fondo { background: url("assets/texturas/papel.svg") center / cover; }
    .papel .rugoso { opacity: 0.35; }
    .papel .grano { mix-blend-mode: normal; opacity: 0.06; }

    .cita { display: flex; align-items: center; justify-content: center; }
    .bloque {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--blanco);
    }
    .papel .bloque { color: var(--tinta); }
    .chica { font: 500 52px/1.2 "Inter", sans-serif; letter-spacing: -0.01em; opacity: 0.88; white-space: nowrap; }
    .clave { font: 800 160px/0.95 "Inter", sans-serif; letter-spacing: -0.03em; white-space: nowrap; width: max-content; }
    .clave.serif { font: italic 700 176px/1.05 "Playfair Display", serif; letter-spacing: -0.01em; }
    .papel .clave.serif { color: var(--azul); }
    .palabra { display: inline-block; }
    .comilla {
      position: absolute;
      font: italic 700 300px/1 "Playfair Display", serif;
      color: var(--blanco);
      opacity: 0.92;
    }
    .papel .comilla { color: var(--azul); opacity: 1; }
    .abre { left: -80px; top: -175px; }
    .cierra { right: -115px; bottom: -255px; }
  </style>

  <div id="root" data-composition-id="texto-comillas" data-width="1080" data-height="1920">
    <div class="escena azul capa">
      <div class="camara">
        <div class="capa fondo"></div>
        <div class="capa rugoso"></div>
        <div class="capa grano"></div>
        <div class="capa cita">
          <div class="bloque">
            <span class="comilla abre" data-layout-allow-overflow>“</span>
            <span class="chica" data-t="0.08 0.30 0.48 0.62 0.78">La constancia le gana al</span>
            <span class="clave serif" data-t="1.10">talento.</span>
            <span class="comilla cierra" data-layout-allow-overflow>”</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const raiz = document.querySelector('[data-composition-id="texto-comillas"]');
      const ANCHO_MAX = 860;

      // --- común a las escenas minimal premium ---
      const partirPalabras = (r) => {
        const out = [];
        r.querySelectorAll("[data-t]").forEach((linea) => {
          const t = linea.dataset.t.trim().split(/\s+/).map(Number);
          const textos = linea.textContent.trim().split(/\s+/);
          linea.textContent = "";
          textos.forEach((txt, i) => {
            const s = document.createElement("span");
            s.className = "palabra";
            s.textContent = txt;
            linea.append(s);
            if (i < textos.length - 1) linea.append(" ");
            // ponytail: si faltan tiempos, las palabras sobrantes van cada 0,12 s
            out.push({ el: s, t: t[i] ?? t[t.length - 1] + 0.12 * (i - t.length + 1), clave: linea.classList.contains("clave") });
          });
        });
        return out;
      };
      const ajustarClaves = (r, max) =>
        r.querySelectorAll(".clave").forEach((el) => {
          if (el.offsetWidth > max) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * max) / el.offsetWidth + "px";
        });
      const entrarPalabras = (tl, palabras) =>
        palabras.filter((p) => p.t > 0).forEach(({ el, t, clave }) => { // t = 0: ya está en pantalla en el cuadro 1
          tl.fromTo(el, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, t);
          if (clave) tl.fromTo(el, { scale: 0.96 }, { scale: 1, duration: 0.25, ease: "power3.out" }, t);
        });
      // El runtime oculta con display:none las escenas que no están en pantalla: se mide mostrándola un instante.
      const medir = (r, fn) => {
        const s = r.getAttribute("style");
        r.style.setProperty("display", "block", "important");
        try { return fn(); } finally { s == null ? r.removeAttribute("style") : r.setAttribute("style", s); }
      };
      const fuentes = Promise.all(["500 40px Inter", "800 40px Inter", "italic 700 40px 'Playfair Display'"].map((f) => document.fonts.load(f))).catch(() => {});
      // --- fin común ---

      const palabras = partirPalabras(raiz);
      fuentes.then(() => {
        medir(raiz, () => ajustarClaves(raiz, ANCHO_MAX));
        const tl = gsap.timeline({ paused: true });
        // Deriva de cámara desde el cuadro 1: acercamiento lento de toda la lámina (fondo + textura + texto)
        tl.fromTo(raiz.querySelector(".camara"), { scale: 1, y: 0 }, { scale: 1.05, y: -24, duration: 3, ease: "sine.inOut" }, 0);
        entrarPalabras(tl, palabras);
        window.__timelines = window.__timelines || {};
        window.__timelines["texto-comillas"] = tl;
      });
    })();
  </script>
</template>
